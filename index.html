<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo V2.0 · TypeScript</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div class="todo-app">
    <h1>Todo V2.0</h1>
    <div class="input-row">
      <input id="todo-input" type="text" maxlength="100" placeholder="请输入待办事项" aria-label="待办事项" />
      <button id="add-btn" type="button">添加</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <div class="filter-row">
      <button type="button" data-filter="all" class="active">全部</button>
      <button type="button" data-filter="active">未完成</button>
      <button type="button" data-filter="completed">已完成</button>
    </div>
    <ul id="todo-list"></ul>
    <p id="empty-state" class="empty-state">暂无待办事项</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
